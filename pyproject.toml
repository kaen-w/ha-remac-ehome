[project]
name = "ha-remac-ehome"
version = "1.0.0"
description = "Home Assistant integration for REMAC / Midea 云邻 e家 door locks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py13"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
