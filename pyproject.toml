[project]
name = "ha-remac-ehome"
version = "1.5.0"
description = "Home Assistant integration for REMAC / Midea 云邻 e家 door locks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 flag "ambiguous" full-width punctuation; this project's strings
# are Chinese, so they are noise here.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
